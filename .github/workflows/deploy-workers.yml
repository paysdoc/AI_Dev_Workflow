name: Deploy Workers

on:
  # No paths filter here: GitHub matches it against at most 300 changed files of a push,
  # and a release from dev often changes more. The changes job decides instead.
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect changed workers
    runs-on: ubuntu-latest
    outputs:
      screenshot-router: ${{ steps.filter.outputs.screenshot-router }}
      cost-api: ${{ steps.filter.outputs.cost-api }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # The pushed branch itself, so the diff starts at the commit the push replaced.
          # The default, dev, is main's merge base after a release merge, so it finds nothing.
          base: ${{ github.ref }}
          filters: |
            screenshot-router:
              - 'workers/screenshot-router/**'
              - '.github/workflows/deploy-workers.yml'
            cost-api:
              - 'workers/cost-api/**'
              - '.github/workflows/deploy-workers.yml'

  deploy-screenshot-router:
    name: Deploy screenshot-router
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.screenshot-router == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: workers/screenshot-router
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-cost-api:
    name: Deploy cost-api
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cost-api == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: workers/cost-api
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
