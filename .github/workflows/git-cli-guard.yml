name: Git/GH CLI Guard

on:
  pull_request:
  push:

jobs:
  guard:
    name: Fail on direct git/gh shell-outs outside GitContext
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run Git/GH CLI guard
        run: bun run lint:git-guard
