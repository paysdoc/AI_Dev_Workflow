name: Git/GH CLI Guard

on:
  pull_request:
  push:

jobs:
  guard:
    name: Fail on direct git/gh shell-outs, cwd-derived identity, or ad-hoc construction
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run Git/GH CLI guard (3 rules)
        run: bun run lint:git-guard

  docs-index:
    name: Fail on a broken living-docs index
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run docs-index gate
        run: bun run lint:docs-index
